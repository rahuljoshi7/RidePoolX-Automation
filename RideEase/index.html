<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RideEase – Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="brand">
      <span class="brand-icon">🚗</span>
      <h1 class="brand-name">RideEase</h1>
      <p class="brand-tagline">Your ride, your way</p>
    </div>

    <div class="card" id="loginCard">
      <h2 class="card-title">Welcome Back</h2>
      <p class="card-subtitle">Sign in to continue</p>

      <div id="errorMsg" class="error-msg hidden">Invalid email or password. Try again.</div>
      <div id="successMsg" class="success-msg hidden">Login successful! Redirecting...</div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="off"/>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password"/>
      </div>

      <button id="loginBtn" class="btn btn-primary" onclick="handleLogin()">Login</button>

      <p class="form-footer">
        Don't have an account? <a href="#">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
